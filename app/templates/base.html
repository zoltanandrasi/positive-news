<!DOCTYPE html>
<html lang="{{ t.html_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/">{{ site_title }}</a>
      <span class="tagline">{{ t.tagline }}</span>
    </div>
    <nav class="wrap nav">
      <a href="/" class="{% if active is none and request.url.path == '/' %}active{% endif %}">{{ t.home }}</a>
      {% for c in categories %}
        <a href="/category/{{ c.slug }}" class="{% if active == c.slug %}active{% endif %}">{{ c.name }}</a>
      {% endfor %}
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="wrap site-footer">
    {{ t.footer_last_refresh }}: {{ last_run | hutime }} ·
    {{ t.footer_note }} ·
    <a href="/status">{{ t.status }}</a>
  </footer>
</body>
</html>
