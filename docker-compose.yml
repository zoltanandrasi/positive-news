# Synology Container Manager > Project > Create: paste this file.
# Before creating the project, create two empty subfolders in the project folder:
# "config" and "data". Synology does not create them automatically.
#
# Updates are automatic: Watchtower checks GitHub every hour and restarts
# positive-news when a new version is available. Nothing else is touched.
services:
  positive-news:
    image: ghcr.io/zoltanandrasi/positive-news:latest
    pull_policy: always      # download the newest image on every Build/start
    container_name: positive-news
    restart: unless-stopped
    dns:                     # public DNS servers: some Synology setups give containers
      - 1.1.1.1              # no working DNS, so every feed fails with
      - 8.8.8.8              # "Temporary failure in name resolution"
    ports:
      - "8080:8000"          # the left number is the NAS port; change it if 8080 is taken
    environment:
      REFRESH_INTERVAL_HOURS: "2"   # refresh interval in hours (e.g. 0.5 = every 30 minutes)
      RETENTION_DAYS: "14"          # articles older than this are deleted
      LEAD_MAX_CHARS: "320"         # maximum lead length
      SITE_TITLE: "Jó Hírek"        # site name shown in the header
      UI_LANGUAGE: "hu"             # website text language: hu or en
      TZ: "Europe/Budapest"
    volumes:
      - ./data:/data          # database
      - ./config:/config      # optional own feeds.yaml / filters.yaml (see README)
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower:latest
    container_name: positive-news-watchtower
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"     # only update containers with the label above
      WATCHTOWER_POLL_INTERVAL: "3600"    # check every hour (seconds)
      WATCHTOWER_CLEANUP: "true"          # remove the old image after updating
      TZ: "Europe/Budapest"
